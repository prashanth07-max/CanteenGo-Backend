spring.application.name=canteengo
server.port=8080

# MySQL - change username/password via env vars or edit below
spring.datasource.url=jdbc:mysql://localhost:3306/canteengo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.error.include-message=always
