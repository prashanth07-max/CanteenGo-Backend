spring.application.name=canteengo
# PaaS hosts (Render/Railway/Heroku) inject PORT; default 8080 locally.
server.port=${PORT:8080}

# MySQL - values come from environment variables when present (Docker Compose),
# otherwise the local defaults below are used (running without Docker).
# Hosted/managed MySQL usually requires TLS: in production include &sslMode=REQUIRED in DB_URL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/canteengo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool tuning for cloud databases (prevents connection exhaustion on Aiven)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.error.include-message=always

# CORS - comma-separated allowed frontend origins (env: CORS_ALLOWED_ORIGINS).
# Defaults cover the Vite dev servers; add your deployed frontend URL for production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Initial admin bootstrap (env: ADMIN_EMAIL / ADMIN_PASSWORD). Used only when no
# ADMIN account exists yet; existing admins are never modified. On a fresh database
# with these unset, startup fails rather than creating an insecure default account.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
